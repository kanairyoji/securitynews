# 生成済みの静的HTMLをそのまま GitHub Pages へ配信する。
#
# このリポジトリは gen_report.py / gen_index.py / gen_incident.py などが
# 出力した HTML だけで構成されており、ビルド処理は不要（.nojekyll 済み）。
# 従来の legacy（ブランチ配信）は 2026-08-06 にデプロイキューが固着して
# 復旧しなかったため、Actions ベースへ移行した。
name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # 手動でも流せるようにしておく

permissions:
  contents: read
  pages: write
  id-token: write

# 日次パイプラインは1日に複数回 push する（日次レポート → インシデント事例）。
# 古い実行が詰まったまま後続が待たされるのを避けるため、新しい push を優先する。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
