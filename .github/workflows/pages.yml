# 生成済みの静的HTMLをそのまま GitHub Pages へ配信する。
#
# このリポジトリは gen_report.py / gen_index.py / gen_incident.py などが
# 出力した HTML だけで構成されており、ビルド処理は不要（.nojekyll 済み）。
#
# 2026-08-06: legacy（ブランチ配信）でデプロイが deployment_queued のまま
# タイムアウトする事象が続いたため Actions ベースへ移行。
# 切り分けのため MINIMAL=1 のときは最小構成だけを配信する。
name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      minimal:
        description: '最小構成だけを配信して切り分ける'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Pages のデプロイは中断すると環境が詰まることがあるため打ち切らない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          if [ "${{ github.event.inputs.minimal }}" = "true" ]; then
            echo "MINIMAL mode: index.html のみ配信"
            cp index.html _site/
            touch _site/.nojekyll
          else
            # .git / .github / _site 以外をすべて配信する
            rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          fi
          echo "--- 配信するファイル ---"
          find _site -type f | head -20
          echo "ファイル数: $(find _site -type f | wc -l)"
          du -sh _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
